name: Update vulnerable build dependencies

on:
  push:
    branches: [fix/dependency-security-2026-10]
    paths:
      - ".github/workflows/update-security-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade build and test toolchain
        run: npm install --save-dev electron-builder@26.15.3 vitest@5.0.4 vite@^7.0.0 @vitejs/plugin-react@^5.0.0
      - name: Commit updated package manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "fix: update vulnerable build dependencies"
          git push origin HEAD:fix/dependency-security-2026-10
