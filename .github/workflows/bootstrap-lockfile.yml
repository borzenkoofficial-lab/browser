name: Bootstrap dependency lockfile

on:
  push:
    branches: [chore/reproducible-dependencies]
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/reproducible-dependencies
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate package lock without running install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock changes to commit."
            exit 0
          fi
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:chore/reproducible-dependencies
